<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#fff4de">
    <title>인정욕구 채우기</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@700;900&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap" rel="stylesheet">
    <script type="importmap">
      {"imports": {
        "three": "https://threejs.org/build/three.module.js",
        "three/addons/": "https://threejs.org/examples/jsm/"
      }}</script>
  </head>

  <body>
    <canvas id="scene"></canvas>
    <div id="controls" class="off">
      <div id="stem">
        <div id="stemBody"></div>
        <div id="ribbon">
          <div class="hi"></div>
          <div id="marks"></div>
        </div>
        <div id="finger"></div>
      </div>
    </div>
    <div id="customMenu" class="custom-menu" aria-label="Custom actions">
      <button id="customToggle" class="custom-toggle" aria-expanded="false" aria-controls="customPanel">MENU <kbd>E</kbd></button>
      <div id="customPanel" class="custom-panel" hidden>
        <button id="bandCrazy" class="pill custom-action crazy-action" aria-label="Make Band Crazy">Make Band Crazy</button>
        <button id="fight" class="pill custom-action" aria-label="Fight People">Fight People</button>
        <button id="meteor" class="pill custom-action meteor-action" aria-label="Summon meteor">Meteor</button>
        <button id="smellyPerson" class="pill custom-action smelly-action" aria-label="Bring in a smelly person">Smelly Person</button>
      </div>
    </div>
    <button id="pause" aria-label="멈춤"><i></i><i></i></button>
    <button id="nextSong" aria-label="다음 곡으로 넘기기">다음 곡<svg viewBox="0 0 16 16" aria-hidden="true">
        <path d="M2 2v12l9-6zM12 2h2v12h-2z" />
      </svg></button>
    <button id="endShow" class="pill" aria-label="공연 끝내기"><i></i>공연 끝내기</button>
    <div id="finBar"><button id="encore" class="pill go">한 곡 더</button><button id="finHome" class="pill">처음으로</button>
    </div>
    <button id="special" aria-label="트럼펫 두 대"><span class="fill"></span><svg viewBox="9 9 102 102" aria-hidden="true">
        <defs>
          <linearGradient id="brA" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fff4c0" />
            <stop offset=".35" stop-color="#ffd35c" />
            <stop offset=".72" stop-color="#e6a12a" />
            <stop offset="1" stop-color="#a8641a" />
          </linearGradient>
          <linearGradient id="brB" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#ffe390" />
            <stop offset=".5" stop-color="#ffc947" />
            <stop offset="1" stop-color="#d48a22" />
          </linearGradient>
          <radialGradient id="bellIn" cx=".5" cy=".5" r=".55">
            <stop offset="0" stop-color="#7a3f10" />
            <stop offset=".55" stop-color="#c9801f" />
            <stop offset="1" stop-color="#ffd76a" />
          </radialGradient>
          <linearGradient id="sil" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" />
            <stop offset=".5" stop-color="#cfd4e2" />
            <stop offset="1" stop-color="#8d93a8" />
          </linearGradient>
          <g id="tpt" stroke="#221a2b" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round">
            <path d="M30 27 L30 35 Q30 39 34 39 L64 39 Q68 39 68 35 L68 29" fill="none" stroke-width="7.4" />
            <path d="M30 27 L30 35 Q30 39 34 39 L64 39 Q68 39 68 35 L68 29" fill="none" stroke="url(#brA)"
              stroke-width="3.6" />
            <path d="M44 15 L44 9 M51 15 L51 9 M58 15 L58 9" stroke-width="2.4" />
            <rect x="15" y="20.5" width="49" height="5.2" rx="2.4" fill="url(#brA)" />
            <rect x="40.8" y="13" width="6.4" height="19" rx="2" fill="url(#brA)" />
            <rect x="47.8" y="13" width="6.4" height="19" rx="2" fill="url(#brA)" />
            <rect x="54.8" y="13" width="6.4" height="19" rx="2" fill="url(#brA)" />
            <ellipse cx="44" cy="7.8" rx="3.6" ry="1.9" fill="#fff8ec" />
            <ellipse cx="51" cy="7.8" rx="3.6" ry="1.9" fill="#fff8ec" />
            <ellipse cx="58" cy="7.8" rx="3.6" ry="1.9" fill="#fff8ec" />
            <rect x="62" y="20" width="26" height="6.4" rx="2.6" fill="url(#brA)" />
            <path d="M86 20.2 C96 19 104 12 113 4 L113 43 C104 35 96 28.2 86 27 Z" fill="url(#brB)" />
            <ellipse cx="113" cy="23.5" rx="3.6" ry="19.8" fill="#ffe08a" />
            <ellipse cx="113.6" cy="23.5" rx="2" ry="16.5" fill="url(#bellIn)" stroke-width="1.2" />
            <path d="M3 19.5 Q3 17 6 17.4 L15 21.2 L15 25 L6 28.8 Q3 29.2 3 26.7 Z" fill="url(#sil)" />
            <path d="M18 22 L62 22 M64 21.6 L86 21.6 M89 18.8 C98 17 104 12 110 7" fill="none" stroke="#fffbe6"
              stroke-width="1.3" opacity=".85" />
          </g>
        </defs>
        <g transform="translate(60 60) rotate(-38) translate(-58 -24)">
          <use href="#tpt" />
        </g>
        <g transform="translate(60 60) scale(-1 1) rotate(-38) translate(-58 -24)">
          <use href="#tpt" />
        </g>
      </svg><i class="spark s1"></i><i class="spark s2"></i><i class="spark s3"></i></button>
    <div id="hudMode" class="mode"><button data-m="snap">보정</button><button data-m="free">자유</button></div>
    <div id="autoMode" class="mode"><button data-auto="off" class="on">직접</button><button data-auto="on">자동</button></div>
    <div id="finishHint" hidden>마지막 음을 연주하고 손을 떼세요</div>

    <div id="title" class="screen">
      <svg class="logo" viewBox="0 0 640 380" role="img" aria-label="인정욕구 채우기">
        <text x="310" y="168" text-anchor="middle">인정욕구</text>
        <text class="em" x="380" y="335" text-anchor="middle">채우기</text>
      </svg>
      <button id="start" disabled><i class="fill"></i><b>소리 준비 중</b></button>
    </div>
    <div id="paused" class="screen hide">
      <div class="card">
        <div class="tape"></div>
        <div class="kicker">잠깐 멈춤</div>
        <div class="pickmode" style="margin-top:12px">
          <button data-m="snap"><b>보정</b><span>코드에 맞는 음으로</span></button>
          <button data-m="free"><b>자유</b><span>짚은 자리 그대로</span></button>
        </div>
        <button id="resume" class="big">계속</button>
        <button id="toTitle" class="small">처음으로</button>
        <p class="credit">소리: VSCO 2 Community Edition (CC0), Sonatina Symphonic Orchestra (CC Sampling+ 1.0)</p>
      </div>
    </div>

    <div id="gameOver" class="screen hide" aria-live="assertive">
      <div class="game-over-card"><div class="game-over-eyebrow">THE CROWD GOT YOU</div><div class="game-over-title">GAME OVER</div><button id="gameOverHome" class="pill go">처음으로</button></div>
    </div>
    <script>
      (function () {
        const audiopackEvt = new Event('audiopack');
        var s = document.createElement('script');
        s.type = 'text/javascript';
        s.src = 'https://cdn.jsdelivr.net/gh/aaffffffffff123-lang/egotrip@main/audio.js';
        s.async = true;
        s.onload = () => {
          window.__audioReady = true;
          window.dispatchEvent(audiopackEvt);
        };
        s.onerror = () => {
          window.__audioFailed = true;
          window.dispatchEvent(audiopackEvt);
        };
        document.head.appendChild(s);
      })();
    </script>
    <script type="module" src="main.js"></script>
  </body>
</html>
